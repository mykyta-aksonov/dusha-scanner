<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сканер картки гостя</title>
  <!-- Mini App для бариста: открывается кнопкой «📷 Сканувати картку» в боте.
       Разместите файл на любом HTTPS-хостинге и впишите адрес в SCANNER_URL. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .icon { font-size: 56px; }
    p { color: var(--tg-theme-hint-color, #8a8a8a); }
    button {
      font-size: 17px;
      padding: 14px 28px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">📷</div>
    <h2>Сканер картки гостя</h2>
    <p id="hint">Наведіть камеру на QR-код у телефоні гостя</p>
    <button id="scan">Сканувати</button>
  </main>
  <script>
    const tg = window.Telegram.WebApp;
    const hint = document.getElementById("hint");
    tg.ready();
    tg.expand();

    function scan() {
      if (!tg.isVersionAtLeast("6.4")) {
        hint.textContent = "Оновіть Telegram, щоб сканувати QR-коди";
        return;
      }
      try {
        tg.showScanQrPopup({ text: "QR-код картки гостя" }, (text) => {
          // Бот получит код как message.web_app_data, окно закроется само
          tg.sendData(text.trim());
          return true;
        });
      } catch (error) {
        hint.textContent = "Сканер доступний лише в мобільному Telegram";
      }
    }

    document.getElementById("scan").addEventListener("click", scan);
    scan();
  </script>
</body>
</html>
